<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound Lab – SoundDesign</title>
    <style>
      /* Theme: light (design system) */
      :root {
        color-scheme: light;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --content2: #f4f4f5;
        --content3: #e4e4e7;
        --content4: #d4d4d8;
        --text: #000000;
        --muted: #8a8a8c;
        --accent: #006fee;
        --accent-dim: #dfedfd;
        --border: #e3e3e6;
        --border-inactive: #d4d4d8;
        --default-400: #dcdcdf;
        --default-500: #d4d4d8;
        --default-600: #afafb2;
        --default-700: #8a8a8c;
        --default-800: #656567;
        --shadow-subtle: rgba(0, 0, 0, 0.04);
        --shadow-edge: rgba(0, 0, 0, 0.05);
      }
      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #000000;
        --panel: #18181b;
        --content2: #27272a;
        --content3: #3f3f46;
        --content4: #52525b;
        --text: #ffffff;
        --muted: #b2b2b5;
        --accent: #006fee;
        --accent-dim: #002147;
        --border: #3f3f46;
        --border-inactive: #52525b;
        --default-400: #3f3f46;
        --default-500: #65656b;
        --default-600: #8c8c90;
        --default-700: #b2b2b5;
        --default-800: #d9d9da;
        --shadow-subtle: rgba(255, 255, 255, 0.04);
        --shadow-edge: rgba(255, 255, 255, 0.06);
      }
      [data-theme="dark"] .pad {
        background: var(--content2);
        border-color: var(--content4);
      }
      [data-theme="dark"] .pad:hover {
        background: var(--content3);
      }
      body[data-collection="Glass"] {
        --accent: #65656b;
        --accent-dim: #3f3f46;
      }
      [data-theme="dark"] body[data-collection="Glass"] {
        --accent: #8c8c90;
        --accent-dim: #323238;
      }
      body[data-collection="Agent"] {
        --accent: #7828c8;
        --accent-dim: #eee4f8;
      }
      [data-theme="dark"] body[data-collection="Agent"] {
        --accent: #904ed2;
        --accent-dim: #39135f;
      }
      body[data-collection="Woods"] {
        --accent: #5d4e37;
        --accent-dim: #ebe6df;
      }
      [data-theme="dark"] body[data-collection="Woods"] {
        --accent: #8b7355;
        --accent-dim: #2d261c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 28px;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 32px;
      }
      .sound-lab-card {
        margin-bottom: 32px;
      }
      h1 {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.087px;
        color: var(--text);
      }
      .header-switch-wrap {
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }
      .switch {
        width: 40px;
        height: 24px;
        flex-shrink: 0;
        border: none;
        padding: 0;
        margin: 0;
        border-radius: 12px;
        background: var(--default-400);
        cursor: pointer;
        position: relative;
        transition: background 0.2s ease;
      }
      .switch[aria-checked="true"] {
        background: var(--accent);
      }
      .switch-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }
      .switch[aria-checked="true"] .switch-thumb {
        transform: translateX(16px);
      }
      h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
      }
      header a {
        color: var(--accent);
        text-decoration: none;
        font-size: 14px;
      }
      header a:hover {
        text-decoration: underline;
      }
      .active-sound-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      .sound-lab-card {
        width: 100%;
        min-height: 384px;
        max-height: 512px;
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 0 0 1px var(--border), 0 1px 3px var(--shadow-subtle);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.25rem;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }
      .active-sound-circle {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px color-mix(in oklch, var(--accent) 30%, transparent);
        cursor: pointer;
      }
      .active-sound-circle .icon {
        width: 32px;
        height: 32px;
        color: #fff;
      }
      .active-sound-circle .icon path {
        fill: currentColor;
      }
      .active-sound-circle .label {
        display: none;
      }
      .dot-indicators {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.25rem;
      }
      .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--border-inactive);
        border: none;
        padding: 0;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .dot.active {
        background: var(--accent);
      }
      .pickers-wrapper {
        display: grid;
        grid-template-columns: auto 1px auto;
        gap: 48px;
        align-items: center;
        justify-content: center;
      }
      .pickers-divider {
        background: var(--border);
        width: 1px;
        height: 96px;
        align-self: center;
        margin-block: auto;
      }
      .pad-section {
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      .pad-section-title {
        margin: 0;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 12px;
        font-weight: 600;
        color: var(--default-700);
        text-align: center;
      }
      .pad-grid {
        display: grid;
        grid-template-columns: repeat(3, 32px);
        gap: 0.5rem;
      }
      .pad {
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--default-600);
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: border-color 0.2s, color 0.2s, transform 0.1s;
        font-size: 0;
      }
      .pad:hover {
        color: var(--default-800);
        border-color: var(--default-500);
      }
      .pad:active {
        transform: scale(0.98);
      }
      .pad:disabled {
        cursor: default;
      }
      .pad.active {
        border-width: 2px;
        border-color: var(--accent);
        color: var(--accent);
      }
      .pad .icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .pad:not(.active) .icon {
        color: var(--default-700);
      }
      .pad .icon path {
        fill: currentColor;
      }
      .pad span:not(.icon) {
        display: none;
      }
      .controls-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        padding: 0;
      }
      .controls-bar .sound-toggle {
        display: none;
      }
      .pill {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      input[type="range"] {
        width: 100px;
      }
      .volume-slider-wrap {
        --slider-fill: #22c55e;
        --slider-track: #e5e7eb;
        --default-transition-duration: 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        max-width: 28rem;
        margin: 0 auto;
        min-height: 28px;
        border-radius: 100%;
      }
      [data-theme="dark"] .volume-slider-wrap {
        --slider-track: #3f3f46;
      }
      .volume-slider-wrap .volume-icon {
        width: 1.5rem;
        height: 1.5rem;
        flex-shrink: 0;
        color: var(--default-700);
      }
      .volume-slider-inner {
        flex: 1;
        min-width: 0;
        position: relative;
        height: 28px;
      }
      .volume-slider-track {
        position: absolute;
        inset: 0;
        height: 28px;
        border-radius: 14px;
        background: var(--slider-track);
      }
      .volume-slider-fill {
        
        position: absolute;
        left: 0;
        top: 0;
        height: 28px;
        width: var(--slider-pct, 40%);
        margin-right: 8px;
        background: var(--slider-fill);
        border-radius: 14px;
      }
      .volume-slider-thumb {
      min-width: 32px;
        position: absolute;
        left: calc(var(--slider-pct, 40%) - 16px);
        top: 50%;
        transform: translate(-50%, -50%);
        width: 32px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 2;
      }
      .volume-slider-thumb-ball {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0px 0px 5px 0px #00000005, 0px 2px 10px 0px #0000000f, 0px 0px 1px 0px #0000004d;
        transition: transform var(--default-transition-duration) cubic-bezier(0.4, 0, 0.2, 1);
      }
      .volume-slider-wrap.thumb-hover .volume-slider-thumb-ball,
      .volume-slider-wrap.thumb-active .volume-slider-thumb-ball {
        transform: scale(0.8);
      }
      .volume-slider-wrap .volume-slider {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 28px;
        margin: 0;
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        z-index: 1;
      }
      .volume-slider-wrap .volume-slider:focus {
        outline: none;
      }
      .volume-slider-wrap .volume-slider::-webkit-slider-runnable-track {
        height: 28px;
        background: transparent;
      }
      .volume-slider-wrap .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 28px;
        height: 28px;
        margin-top: 0;
        border-radius: 0;
        background: transparent;
        cursor: pointer;
      }
      .volume-slider-wrap .volume-slider::-moz-range-track {
        height: 28px;
        background: transparent;
      }
      .volume-slider-wrap .volume-slider::-moz-range-thumb {
        width: 28px;
        height: 28px;
        border-radius: 0;
        background: transparent;
        cursor: pointer;
        border: none;
      }
      .footer {
        font-size: 12px;
        color: var(--muted);
      }

      /* Mobile: same behaviour, 44px pads, 20px icons, divider hidden, modes inline below 3x3 */
      @media (max-width: 640px) {
        .pickers-wrapper {
          grid-template-columns: 1fr;
          gap: 24px;
        }
        .pickers-divider {
          display: none;
        }
        .pad-grid {
          grid-template-columns: repeat(3, 44px);
          gap: 0.5rem;
        }
        .pad {
          width: 44px;
          height: 44px;
        }
        .pad .icon {
          width: 20px;
          height: 20px;
        }
        #sectionConcepts .pad-grid {
          display: flex;
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          gap: 8px;
          grid-template-columns: unset;
        }
        #sectionConcepts .pad-grid .pad:disabled {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Sound Lab</h1>
        <div class="header-switch-wrap">
          <button type="button" class="switch" id="themeSwitch" role="switch" aria-checked="false" aria-label="Tema oscuro">
            <span class="switch-thumb"></span>
          </button>
        </div>
      </header>

      <section class="controls-bar">
        <label class="sound-toggle" aria-hidden="true">
          <input id="soundEnabled" type="checkbox" checked aria-label="Enable sounds" />
          Sound

            <button type="button" class="pad" id="btnStartup" data-label="Startup"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19.906 9c.382 0 .749.057 1.094.162V9a3 3 0 0 0-3-3h-3.879a.75.75 0 0 1-.53-.22L11.47 3.66A2.25 2.25 0 0 0 9.879 3H6a3 3 0 0 0-3 3v3.162A3.756 3.756 0 0 1 4.094 9h15.812ZM4.094 10.5a2.25 2.25 0 0 0-2.227 2.568l.857 6A2.25 2.25 0 0 0 4.951 21H19.05a2.25 2.25 0 0 0 2.227-1.932l.857-6a2.25 2.25 0 0 0-2.227-2.568H4.094Z"/></svg>Startup</button>
          </div>

    <script>
      (function () {
        var theme = "light";
        try {
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <script>
      if (window.location.protocol === "file:") {
        document.body.innerHTML = "<div style=\"font-family:system-ui;max-width:420px;margin:2rem auto;padding:1.5rem;text-align:center;background:#fef3c7;border:1px solid #f59e0b;border-radius:12px;color:#92400e;\"><p style=\"margin:0 0 0.5rem;font-weight:600;\">No funciona con file://</p><p style=\"margin:0;font-size:0.9rem;\">Los módulos ES no se cargan al abrir el HTML directamente. Desde la carpeta del proyecto ejecuta en la terminal:</p><code style=\"display:block;margin:1rem 0;padding:0.75rem;background:#fff;border-radius:8px;font-size:0.85rem;\">python3 -m http.server 5173</code><p style=\"margin:0;font-size:0.9rem;\">Luego abre <strong>http://localhost:5173</strong> en el navegador.</p></div>";
      }
    </script>
    <script type="module">
      import {
        getAudioContext,
        setMasterVolume,
        setCollection,
        getCurrentCollectionName,
        playSine,
        playTriangle,
        playSquare,
        playClick,
        playPop,
        playTick,
        playToggle,
        playDropPressed,
        playSuccess,
        playError,
        playWarning,
        playStartup,
      } from "./audio/sounds.js";

      const soundEnabledEl = document.getElementById("soundEnabled");
      const activeSoundIcon = document.getElementById("activeSoundIcon");
      const activeSoundLabel = document.getElementById("activeSoundLabel");
      const sectionClick = document.getElementById("sectionClick");
      const sectionConcepts = document.getElementById("sectionConcepts");
      const volumeSliderEl = document.getElementById("volumeSlider");

      if (volumeSliderEl) {
        var wrap = volumeSliderEl.closest(".volume-slider-wrap");
        var inner = document.querySelector(".volume-slider-inner");
        var thumbEl = document.getElementById("volumeSliderThumb");
        function updateSliderUI() {
          if (wrap) wrap.style.setProperty("--slider-pct", volumeSliderEl.value + "%");
        }
        function addThumbActive() {
          if (wrap) wrap.classList.add("thumb-active");
        }
        function removeThumbActive() {
          if (wrap) wrap.classList.remove("thumb-active");
        }
        updateSliderUI();
        setMasterVolume(Number(volumeSliderEl.value) / 100);
        volumeSliderEl.addEventListener("input", function () {
          updateSliderUI();
          setMasterVolume(Number(volumeSliderEl.value) / 100);
        });
        volumeSliderEl.addEventListener("mousedown", addThumbActive);
        volumeSliderEl.addEventListener("touchstart", addThumbActive, { passive: true });
        volumeSliderEl.addEventListener("mouseup", removeThumbActive);
        volumeSliderEl.addEventListener("mouseleave", removeThumbActive);
        volumeSliderEl.addEventListener("touchend", removeThumbActive);
        volumeSliderEl.addEventListener("touchcancel", removeThumbActive);
        if (inner && wrap) {
          inner.addEventListener("mousemove", function (e) {
            var pct = Number(volumeSliderEl.value) / 100;
            var thumbCenterX = inner.getBoundingClientRect().left + pct * inner.offsetWidth - 4;
            if (Math.abs(e.clientX - thumbCenterX) <= 14) wrap.classList.add("thumb-hover");
            else wrap.classList.remove("thumb-hover");
          });
          inner.addEventListener("mouseleave", function () { wrap.classList.remove("thumb-hover"); });
        }
      }

      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let soundEnabled = true;

      function isSoundAllowed() {
        if (prefersReducedMotion) return false;
        return soundEnabled;
      }

      function renderMeta() {}

      const clickSectionTitleEl = document.getElementById("clickSectionTitle");

      const selectedSlots = [];
      let nextPlayIndex = 0;

      function isPadSelected(padEl) {
        return selectedSlots.some((s) => s.el === padEl);
      }

      function togglePadSelection(padEl, playFn, label) {
        const idx = selectedSlots.findIndex((s) => s.el === padEl);
        if (idx >= 0) {
          selectedSlots.splice(idx, 1);
          if (nextPlayIndex >= selectedSlots.length && selectedSlots.length > 0) nextPlayIndex = Math.max(0, selectedSlots.length - 1);
        } else {
          selectedSlots.push({ el: padEl, playFn, label });
        }
        refreshSelectionUI();
      }

      function refreshSelectionUI() {
        document.querySelectorAll(".pad").forEach((p) => {
          if (sectionConcepts?.contains(p) && p.hasAttribute("data-collection")) {
            p.classList.toggle("active", p.getAttribute("data-collection") === getCurrentCollectionName());
          } else {
            p.classList.toggle("active", isPadSelected(p));
          }
        });
        const dotIndicatorsEl = document.getElementById("dotIndicators");
        if (dotIndicatorsEl) {
          dotIndicatorsEl.innerHTML = "";
          selectedSlots.forEach((slot, i) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "dot" + (i === nextPlayIndex ? " active" : "");
            btn.setAttribute("role", "tab");
            btn.setAttribute("aria-selected", i === nextPlayIndex);
            btn.setAttribute("data-index", String(i));
            btn.setAttribute("title", slot.label);
            btn.addEventListener("click", () => {
              nextPlayIndex = i;
              refreshSelectionUI();
            });
            dotIndicatorsEl.appendChild(btn);
          });
        }
        const nextSlot = selectedSlots[nextPlayIndex];
        if (nextSlot) {
          const icon = nextSlot.el.querySelector(".icon");
          if (icon) {
            activeSoundIcon.innerHTML = icon.innerHTML;
            activeSoundIcon.setAttribute("viewBox", icon.getAttribute("viewBox") || "0 0 24 24");
          }
          activeSoundLabel.textContent = selectedSlots.length > 1 ? `${nextSlot.label} (${nextPlayIndex + 1}/${selectedSlots.length})` : nextSlot.label;
          if (clickSectionTitleEl && sectionClick?.contains(nextSlot.el)) clickSectionTitleEl.textContent = nextSlot.label;
          if (collectionTitleEl && sectionConcepts?.contains(nextSlot.el)) collectionTitleEl.textContent = nextSlot.label;
        } else {
          activeSoundLabel.textContent = "Select sounds";
        }
      }

      const collectionTitleEl = document.getElementById("collectionTitle");
      if (collectionTitleEl) collectionTitleEl.textContent = getCurrentCollectionName();

      function applyCollectionUI(name) {
        setCollection(name);
        document.body.setAttribute("data-collection", name);
        if (collectionTitleEl) collectionTitleEl.textContent = name;
        document.querySelectorAll("#sectionConcepts .pad[data-collection]").forEach((b) => {
          const isActive = b.getAttribute("data-collection") === name;
          b.setAttribute("aria-pressed", isActive);
          b.classList.toggle("active", isActive);
        });
      }

      document.getElementById("btnBubble")?.addEventListener("click", () => applyCollectionUI("Bubble"));
      document.getElementById("btnGlass")?.addEventListener("click", () => applyCollectionUI("Glass"));
      document.getElementById("btnAgent")?.addEventListener("click", () => applyCollectionUI("Agent"));
      applyCollectionUI(getCurrentCollectionName());

      const themeSwitchEl = document.getElementById("themeSwitch");
      function updateThemeSwitchLabel() {
        if (!themeSwitchEl) return;
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        themeSwitchEl.setAttribute("aria-checked", isDark);
        themeSwitchEl.setAttribute("aria-label", isDark ? "Tema oscuro activado" : "Activar tema oscuro");
      }
      if (themeSwitchEl) {
        updateThemeSwitchLabel();
        themeSwitchEl.addEventListener("click", () => {
          const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          updateThemeSwitchLabel();
        });
      }
      if (soundEnabledEl) soundEnabledEl.addEventListener("change", () => { soundEnabled = soundEnabledEl.checked; });

      const clickPads = [
        ["btnClick", playClick, "Click"],
        ["btnPop", playPop, "Pop"],
        ["btnTick", playTick, "Tick"],
        ["btnDrop", playDropPressed, "Drop"],
        ["btnSuccess", playSuccess, "Success"],
        ["btnError", playError, "Error"],
        ["btnWarning", playWarning, "Warning"],
        ["btnStartup", playStartup, "Startup"],
      ];

      clickPads.forEach(([id, fn, label]) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("click", () => togglePadSelection(el, () => fn(), label));
      });

      let toggleState = false;
      const toggleBtn = document.getElementById("btnToggle");
      const toggleLabelEl = document.getElementById("toggleLabel");
      if (toggleBtn) {
        if (toggleLabelEl) toggleLabelEl.textContent = "Toggle Off";
        toggleBtn.addEventListener("click", () =>
          togglePadSelection(
            toggleBtn,
            async () => {
              toggleState = !toggleState;
              toggleBtn.setAttribute("aria-pressed", toggleState);
              if (toggleLabelEl) toggleLabelEl.textContent = toggleState ? "Toggle On" : "Toggle Off";
              await playToggle(toggleState);
            },
            "Toggle"
          )
        );
      }

      const leftConceptPads = [
        ["btnSine", playSine, "Sine"],
        ["btnTriangle", playTriangle, "Triangle"],
        ["btnSquare", playSquare, "Square"],
      ];
      leftConceptPads.forEach(([id, fn, label]) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("click", () => togglePadSelection(el, () => fn(), label));
      });

      const btnClick = document.getElementById("btnClick");
      if (btnClick) {
        selectedSlots.push({ el: btnClick, playFn: () => playClick(), label: "Click" });
        refreshSelectionUI();
      }

      const activeSoundCircleEl = document.getElementById("activeSoundCircle");
      if (activeSoundCircleEl) {
        activeSoundCircleEl.setAttribute("role", "button");
        activeSoundCircleEl.setAttribute("aria-label", "Play next sound in cycle");
        activeSoundCircleEl.addEventListener("click", async () => {
          if (!isSoundAllowed() || selectedSlots.length === 0) return;
          const slot = selectedSlots[nextPlayIndex];
          await Promise.resolve(slot.playFn());
          nextPlayIndex = (nextPlayIndex + 1) % selectedSlots.length;
          refreshSelectionUI();
          renderMeta();
        });
      }

      setMasterVolume(1);
      renderMeta();
      window.__ctx = getAudioContext;
    </script>
  </body>
