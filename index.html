<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound Lab – SoundDesign</title>
    <style>
      /* Theme: Cursor / VS Code–style palette */
      :root {
        color-scheme: light;
        --bg: #fafafa;
        --panel: #ffffff;
        --content2: #f3f3f3;
        --content3: #e8e8e8;
        --content4: #d4d4d4;
        --text: #1e1e1e;
        --muted: #6e6e6e;
        --accent: #8b5cf6;
        --accent-dim: #ede9fe;
        --border: #e5e5e5;
        --border-inactive: #d4d4d4;
        --default-400: #d4d4d4;
        --default-500: #b4b4b4;
        --default-600: #8e8e8e;
        --default-700: #6e6e6e;
        --default-800: #4e4e4e;
        --shadow-subtle: rgba(0, 0, 0, 0.04);
        --shadow-edge: rgba(0, 0, 0, 0.06);
        --segmented-bg: #e8e8e8;
        --segmented-label: #6e6e6e;
        --segmented-label-hover: #4e4e4e;
        --segmented-active-bg: #ffffff;
        --segmented-active-text: #1e1e1e;
        --tw-inset-shadow: inset 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --tw-inset-ring-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
        --tw-ring-offset-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
        --tw-ring-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
        --tw-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
      }
      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #1e1e1e;
        --panel: #252526;
        --content2: #252526;
        --content3: #2d2d30;
        --content4: #3c3c3c;
        --text: #d4d4d4;
        --muted: #a6a6a6;
        --accent: #a78bfa;
        --accent-dim: #4c1d95;
        --border: #3c3c3c;
        --border-inactive: #454545;
        --default-400: #3c3c3c;
        --default-500: #505050;
        --default-600: #6e6e6e;
        --default-700: #a6a6a6;
        --default-800: #cccccc;
        --shadow-subtle: rgba(0, 0, 0, 0.3);
        --shadow-edge: rgba(255, 255, 255, 0.06);
        --segmented-bg: #2d2d30;
        --segmented-label: #a6a6a6;
        --segmented-label-hover: #cccccc;
        --segmented-active-bg: var(--panel);
        --segmented-active-text: var(--text);
        --tw-inset-shadow: inset 0 1px 2px 0 rgba(0, 0, 0, 0.25);
        --tw-inset-ring-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        --tw-ring-offset-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
        --tw-ring-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
        --tw-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
      }
      [data-theme="dark"] .pad {
        background: var(--content2);
        border-color: var(--content4);
      }
      [data-theme="dark"] .pad:hover {
        background: var(--content3);
      }
      body[data-collection="Glass"] {
        --accent: #65656b;
        --accent-dim: #3f3f46;
      }
      [data-theme="dark"] body[data-collection="Glass"] {
        --accent: #8c8c90;
        --accent-dim: #323238;
      }
      body[data-collection="Agent"] {
        --accent: #7828c8;
        --accent-dim: #eee4f8;
      }
      [data-theme="dark"] body[data-collection="Agent"] {
        --accent: #904ed2;
        --accent-dim: #39135f;
      }
      body[data-collection="Woods"] {
        --accent: #5d4e37;
        --accent-dim: #ebe6df;
      }
      [data-theme="dark"] body[data-collection="Woods"] {
        --accent: #8b7355;
        --accent-dim: #2d261c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 28px;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 32px;
      }
      .sound-lab-card {
        margin-bottom: 32px;
      }
      .mode-switch-section {
        display: flex;
        justify-content: center;
        margin-bottom: 32px;
      }
      h1 {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.087px;
        color: var(--text);
      }
      .header-switch-wrap {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
      }
      .switch {
        width: 40px;
        height: 24px;
        flex-shrink: 0;
        border: none;
        padding: 0;
        margin: 0;
        border-radius: 12px;
        background: var(--default-400);
        cursor: pointer;
        position: relative;
        transition: background 0.2s ease;
      }
      .switch[aria-checked="true"] {
        background: var(--accent);
      }
      .switch-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }
      .switch[aria-checked="true"] .switch-thumb {
        transform: translateX(16px);
      }
      h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
      }
      header a {
        color: var(--accent);
        text-decoration: none;
        font-size: 14px;
      }
      header a:hover {
        text-decoration: underline;
      }
      .active-sound-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      .sound-lab-card {
        width: 100%;
        min-height: 384px;
        max-height: 512px;
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 0 0 1px var(--border), 0 1px 3px var(--shadow-subtle);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.25rem;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }
      .active-sound-circle {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        
        cursor: pointer;
      }
      .active-sound-circle .icon {
        width: 32px;
        height: 32px;
        color: #fff;
      }
      .active-sound-circle .icon path {
        fill: currentColor;
      }
      .active-sound-circle .label {
        display: none;
      }
      .dot-indicators {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.25rem;
      }
      .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--border-inactive);
        border: none;
        padding: 0;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .dot.active {
        background: var(--accent);
      }
      .pickers-wrapper {
        display: grid;
        grid-template-columns: auto 1px auto;
        gap: 48px;
        align-items: center;
        justify-content: center;
      }
      .pickers-divider {
        background: var(--border);
        width: 1px;
        height: 96px;
        align-self: center;
        margin-block: auto;
      }
      .right-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }
      .right-panel .pad-section[hidden] {
        display: none;
      }
      .pad-section {
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      .pad-section-title {
        margin: 0;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 12px;
        font-weight: 600;
        color: var(--default-700);
        text-align: center;
      }
      .pad-grid {
        display: grid;
        grid-template-columns: repeat(3, 32px);
        gap: 0.5rem;
      }
      .pad {
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--default-600);
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: border-color 0.2s, color 0.2s, transform 0.1s;
        font-size: 0;
      }
      .pad:hover {
        color: var(--default-800);
        border-color: var(--default-500);
      }
      .pad:active {
        transform: scale(0.98);
      }
      .pad:disabled {
        cursor: default;
      }
      .pad.active {
        border-width: 2px;
        border-color: var(--accent);
        color: var(--accent);
      }
      .pad .icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .pad:not(.active) .icon {
        color: var(--default-700);
      }
      .pad .icon path {
        fill: currentColor;
      }
      .pad span:not(.icon) {
        display: none;
      }
      .controls-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        padding: 0;
      }
      .controls-bar .sound-toggle {
        display: none;
      }
      .pill {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      input[type="range"] {
        width: 100px;
      }
      .controls-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
      .segmented-control {
        display: inline-flex;
        align-items: center;
        height: 40px;
        padding: 4px;
        background: var(--segmented-bg);
        border-radius: 12px;
      }
      .segmented-option {
        height: 32px;
        padding: 0 12px;
        border: none;
        border-radius: 8px;
        font-size: .875rem;
        font-weight: 500;
        background: transparent;
        color: var(--segmented-label);
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .segmented-option:hover {
        color: var(--segmented-label-hover);
      }
      .segmented-option[aria-selected="true"] {
        background: var(--segmented-active-bg);
        color: var(--segmented-active-text);
        box-shadow: var(--tw-inset-shadow), var(--tw-inset-ring-shadow), var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow);
      }
      .playground-panel .playground-controls {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .playground-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .playground-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }
      .waveform-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .waveform-option {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 12px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .waveform-option:hover {
        background: var(--content2);
      }
      .waveform-option.active {
        border-color: var(--accent);
        background: var(--accent-dim);
        color: var(--accent);
      }
      .playground-slider {
        width: 100%;
        max-width: 200px;
        height: 6px;
        -webkit-appearance: none;
        appearance: none;
        background: var(--content3);
        border-radius: 3px;
      }
      .playground-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }
      .playground-slider::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        border: none;
      }
      .footer {
        font-size: 12px;
        color: var(--muted);
      }

      /* Mobile: same behaviour, 44px pads, 20px icons, divider hidden, modes inline below 3x3 */
      @media (max-width: 640px) {
        .pickers-wrapper {
          grid-template-columns: 1fr;
          gap: 24px;
        }
        .pickers-divider {
          display: none;
        }
        .pad-grid {
          grid-template-columns: repeat(3, 44px);
          gap: 0.5rem;
        }
        .pad {
          width: 44px;
          height: 44px;
        }
        .pad .icon {
          width: 20px;
          height: 20px;
        }
        #sectionConcepts .pad-grid {
          display: flex;
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          gap: 8px;
          grid-template-columns: unset;
        }
        #sectionConcepts .pad-grid .pad:disabled {
          display: none;
        }
      }
    </style>
  </head>

            <button type="button" class="pad" id="btnStartup" data-label="Start"><svg class="icon" viewBox="0 0 256 256" fill="currentColor"><path d="M232.4,114.49,88.32,26.35a16,16,0,0,0-16.2-.3A15.86,15.86,0,0,0,64,39.87V216.13A15.94,15.94,0,0,0,80,232a16.07,16.07,0,0,0,8.36-2.35L232.4,141.51a15.81,15.81,0,0,0,0-27ZM80,215.94V40l143.83,88Z"/></svg>Start</button>

        <div class="pickers-divider" aria-hidden="true"></div>

        <div class="right-panel">
          <!-- Library: selector de colecciones (Bubble, Glass, Agent, Woods). Solo visible en Library. -->
          <section class="pad-section" id="sectionConcepts" data-panel="library">

              <button type="button" class="pad" id="btnBubble" data-collection="Bubble" aria-pressed="false"><svg class="icon" viewBox="0 0 256 256" fill="currentColor"><path d="M132,24A100.11,100.11,0,0,0,32,124v84a16,16,0,0,0,16,16h84a100,100,0,0,0,0-200Zm0,184H48V124a84,84,0,1,1,84,84Z"/></svg>Bubble</button>
              <button type="button" class="pad" id="btnGlass" data-collection="Glass" aria-pressed="false"><svg class="icon" viewBox="0 0 256 256" fill="currentColor"><path d="M200,75.64V40a16,16,0,0,0-16-16H72A16,16,0,0,0,56,40V76a16.07,16.07,0,0,0,6.4,12.8L114.67,128,62.4,167.2A16.07,16.07,0,0,0,56,180v36a16,16,0,0,0,16,16H184a16,16,0,0,0,16-16V180.36a16.09,16.09,0,0,0-6.35-12.77L141.27,128l52.38-39.6A16.05,16.05,0,0,0,200,75.64ZM184,216H72V180l56-42,56,42.35Zm0-140.36L128,118,72,76V40H184Z"/></svg>Glass</button>
              <button type="button" class="pad" id="btnAgent" data-collection="Agent" aria-pressed="true"><svg class="icon" viewBox="0 0 256 256" fill="currentColor"><path d="M197.58,129.06,146,110l-19-51.62a15.92,15.92,0,0,0-29.88,0L78,110l-51.62,19a15.92,15.92,0,0,0,0,29.88L78,178l19,51.62a15.92,15.92,0,0,0,29.88,0L146,178l51.62-19a15.92,15.92,0,0,0,0-29.88ZM137,164.22a8,8,0,0,0-4.74,4.74L112,223.85,91.78,169A8,8,0,0,0,87,164.22L32.15,144,87,123.78A8,8,0,0,0,91.78,119L112,64.15,132.22,119a8,8,0,0,0,4.74,4.74L191.85,144ZM144,40a8,8,0,0,1,8-8h16V16a8,8,0,0,1,16,0V32h16a8,8,0,0,1,0,16H184V64a8,8,0,0,1-16,0V48H152A8,8,0,0,1,144,40ZM248,88a8,8,0,0,1-8,8h-8v8a8,8,0,0,1-16,0V96h-8a8,8,0,0,1,0-16h8V72a8,8,0,0,1,16,0v8h8A8,8,0,0,1,248,88Z"/></svg>Agent</button>
              <button type="button" class="pad" id="btnWoods" data-collection="Woods" aria-pressed="false"><svg class="icon" viewBox="0 0 256 256" fill="currentColor"><path d="M198.1,62.59a76,76,0,0,0-140.2,0A71.71,71.71,0,0,0,16,127.8C15.9,166,48,199,86.14,200A72.09,72.09,0,0,0,120,192.47V232a8,8,0,0,0,16,0V192.47A72.17,72.17,0,0,0,168,200l1.82,0C208,199,240.11,166,240,127.8A71.71,71.71,0,0,0,198.1,62.59ZM169.45,184a56.08,56.08,0,0,1-33.45-10v-41l43.58-21.78a8,8,0,1,0-7.16-14.32L136,115.06V88a8,8,0,0,0-16,0v51.06L83.58,120.84a8,8,0,1,0-7.16,14.32L120,156.94v17a56,56,0,0,1-33.45,10C56.9,183.23,31.92,157.52,32,127.84A55.77,55.77,0,0,1,67.11,76a8,8,0,0,0,4.53-4.67,60,60,0,0,1,112.72,0A8,8,0,0,0,188.89,76,55.79,55.79,0,0,1,224,127.84C224.08,157.52,199.1,183.23,169.45,184Z"/></svg>Woods</button>
              <button type="button" class="pad" disabled aria-hidden="true"></button>
              <button type="button" class="pad" disabled aria-hidden="true"></button>
              <button type="button" class="pad" disabled aria-hidden="true"></button>
              <button type="button" class="pad" disabled aria-hidden="true"></button>
              <button type="button" class="pad" disabled aria-hidden="true"></button>

            <h3 class="pad-section-title" id="collectionTitle">Agent</h3>
          </section>

          <!-- Playground: waveform + Attack + Decay. Solo visible en Playground; no colecciones. -->
          <section class="pad-section playground-panel" id="sectionPlayground" data-panel="playground" hidden>
            <div class="playground-controls">
              <div class="playground-field">
                <span class="playground-label">Waveform</span>
                <div class="waveform-selector" role="group" aria-label="Waveform">
                  <button type="button" class="waveform-option active" data-waveform="sine">Sine</button>
                  <button type="button" class="waveform-option" data-waveform="triangle">Triangle</button>
                  <button type="button" class="waveform-option" data-waveform="square">Square</button>
                  <button type="button" class="waveform-option" data-waveform="sawtooth">Sawtooth</button>
                </div>
              </div>
              <div class="playground-field">
                <label class="playground-label" for="playgroundAttack">Attack <span id="attackValue">0.02</span> s</label>
                <input type="range" id="playgroundAttack" class="playground-slider" min="1" max="200" value="20" aria-label="Attack" />
              </div>
              <div class="playground-field">
                <label class="playground-label" for="playgroundDecay">Decay <span id="decayValue">0.12</span> s</label>
                <input type="range" id="playgroundDecay" class="playground-slider" min="10" max="500" value="120" aria-label="Decay" />
              </div>
            </div>
          </section>
        </div>
        </div>
      </div>

      <section class="mode-switch-section" aria-label="Library or Playground">
        <div class="segmented-control" role="tablist" aria-label="Library or Playground">
          <button type="button" class="segmented-option" id="modeLibrary" role="tab" aria-selected="true" data-mode="library">Library</button>
          <button type="button" class="segmented-option" id="modePlayground" role="tab" aria-selected="false" data-mode="playground">Playground</button>
        </div>
      </section>

    </div>

    <script>
      (function () {
        var theme = "light";
        try {
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <script>
      if (window.location.protocol === "file:") {
        document.body.innerHTML = "<div style=\"font-family:system-ui;max-width:420px;margin:2rem auto;padding:1.5rem;text-align:center;background:#fef3c7;border:1px solid #f59e0b;border-radius:12px;color:#92400e;\"><p style=\"margin:0 0 0.5rem;font-weight:600;\">No funciona con file://</p><p style=\"margin:0;font-size:0.9rem;\">Los módulos ES no se cargan al abrir el HTML directamente. Desde la carpeta del proyecto ejecuta en la terminal:</p><code style=\"display:block;margin:1rem 0;padding:0.75rem;background:#fff;border-radius:8px;font-size:0.85rem;\">python3 -m http.server 5173</code><p style=\"margin:0;font-size:0.9rem;\">Luego abre <strong>http://localhost:5173</strong> en el navegador.</p></div>";
      }
    </script>
    <script type="module">
      import {
        getAudioContext,
        setMasterVolume,
        setCollection,
        getCurrentCollectionName,
        playSine,
        playTriangle,
        playSquare,
        playClick,
        playPop,
        playTick,
        playToggle,
        playDropPressed,
        playSuccess,
        playError,
        playWarning,
        playStartup,
        playPlaygroundTone,
        playPlaygroundDoubleTone,
      } from "./audio/sounds.js";

      setMasterVolume(1);

      const soundEnabledEl = document.getElementById("soundEnabled");
      const activeSoundIcon = document.getElementById("activeSoundIcon");
      const activeSoundLabel = document.getElementById("activeSoundLabel");
      const sectionClick = document.getElementById("sectionClick");
      const sectionConcepts = document.getElementById("sectionConcepts");
      const sectionPlayground = document.getElementById("sectionPlayground");

      let appMode = "library";
      let playgroundWaveform = "sine";
      let playgroundAttackSec = 0.02;
      let playgroundDecaySec = 0.12;

      function setMode(mode) {
        appMode = mode;
        document.getElementById("modeLibrary")?.setAttribute("aria-selected", mode === "library");
        document.getElementById("modePlayground")?.setAttribute("aria-selected", mode === "playground");
        if (sectionConcepts) sectionConcepts.hidden = mode !== "library";
        if (sectionPlayground) sectionPlayground.hidden = mode !== "playground";
      }
      document.getElementById("modeLibrary")?.addEventListener("click", () => {
        if (appMode !== "library" && soundEnabled) playPop();
        setMode("library");
      });
      document.getElementById("modePlayground")?.addEventListener("click", () => {
        if (appMode !== "playground" && soundEnabled) playPop();
        setMode("playground");
      });

      document.querySelectorAll(".waveform-option").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".waveform-option").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          playgroundWaveform = btn.getAttribute("data-waveform");
        });
      });
      const attackSlider = document.getElementById("playgroundAttack");
      const decaySlider = document.getElementById("playgroundDecay");
      const attackValueEl = document.getElementById("attackValue");
      const decayValueEl = document.getElementById("decayValue");
      function updatePlaygroundSliders() {
        playgroundAttackSec = (attackSlider?.value ?? 20) / 1000;
        playgroundDecaySec = (decaySlider?.value ?? 120) / 1000;
        if (attackValueEl) attackValueEl.textContent = playgroundAttackSec.toFixed(2);
        if (decayValueEl) decayValueEl.textContent = playgroundDecaySec.toFixed(2);
      }
      attackSlider?.addEventListener("input", updatePlaygroundSliders);
      decaySlider?.addEventListener("input", updatePlaygroundSliders);
      updatePlaygroundSliders();

      function playPlaygroundForPad(padId) {
        const opts = { type: playgroundWaveform, attackSec: playgroundAttackSec, decaySec: playgroundDecaySec, peak: 0.26 };
        // Success: dos tonos ascendentes (como Library)
        if (padId === "btnSuccess") {
          playPlaygroundDoubleTone({ ...opts, freq1: 523.25, freq2: 659.25, gapSec: 0.06 });
          return;
        }
        // Error: dos tonos descendentes
        if (padId === "btnError") {
          playPlaygroundDoubleTone({ ...opts, freq1: 494, freq2: 370, gapSec: 0.06 });
          return;
        }
        // Warning: dos beeps iguales
        if (padId === "btnWarning") {
          playPlaygroundDoubleTone({ ...opts, freq1: 520, freq2: 520, gapSec: 0.06 });
          return;
        }
        // Startup: barrido 280 → 640 (un solo tono con sweep)
        if (padId === "btnStartup") {
          playPlaygroundTone({ ...opts, freq: 280, freq2: 640 });
          return;
        }
        // Click, Tick: un tono; Pop, Drop: sweep
        const singleMap = {
          btnClick: { freq: 440 },
          btnPop: { freq: 520, freq2: 200 },
          btnTick: { freq: 380 },
          btnDrop: { freq: 350, freq2: 150 },
        };
        const spec = singleMap[padId] || { freq: 440 };
        playPlaygroundTone({ ...opts, ...spec });
      }

      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let soundEnabled = true;

      function isSoundAllowed() {
        if (prefersReducedMotion) return false;
        return soundEnabled;
      }

      function renderMeta() {}

      const clickSectionTitleEl = document.getElementById("clickSectionTitle");

      const selectedSlots = [];
      let nextPlayIndex = 0;

      function isPadSelected(padEl) {
        return selectedSlots.some((s) => s.el === padEl);
      }

      function togglePadSelection(padEl, playFn, label) {
        const idx = selectedSlots.findIndex((s) => s.el === padEl);
        if (idx >= 0) {
          selectedSlots.splice(idx, 1);
          if (nextPlayIndex >= selectedSlots.length && selectedSlots.length > 0) nextPlayIndex = Math.max(0, selectedSlots.length - 1);
        } else {
          selectedSlots.push({ el: padEl, playFn, label });
        }
        refreshSelectionUI();
      }

      function refreshSelectionUI() {
        document.querySelectorAll(".pad").forEach((p) => {
          if (sectionConcepts?.contains(p) && p.hasAttribute("data-collection")) {
            p.classList.toggle("active", p.getAttribute("data-collection") === getCurrentCollectionName());
          } else {
            p.classList.toggle("active", isPadSelected(p));
          }
        });
        const dotIndicatorsEl = document.getElementById("dotIndicators");
        if (dotIndicatorsEl) {
          dotIndicatorsEl.innerHTML = "";
          selectedSlots.forEach((slot, i) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "dot" + (i === nextPlayIndex ? " active" : "");
            btn.setAttribute("role", "tab");
            btn.setAttribute("aria-selected", i === nextPlayIndex);
            btn.setAttribute("data-index", String(i));
            btn.setAttribute("title", slot.label);
            btn.addEventListener("click", () => {
              nextPlayIndex = i;
              refreshSelectionUI();
            });
            dotIndicatorsEl.appendChild(btn);
          });
        }
        const nextSlot = selectedSlots[nextPlayIndex];
        if (nextSlot) {
          const icon = nextSlot.el.querySelector(".icon");
          if (icon) {
            activeSoundIcon.innerHTML = icon.innerHTML;
            activeSoundIcon.setAttribute("viewBox", icon.getAttribute("viewBox") || "0 0 24 24");
          }
          activeSoundLabel.textContent = selectedSlots.length > 1 ? `${nextSlot.label} (${nextPlayIndex + 1}/${selectedSlots.length})` : nextSlot.label;
          if (clickSectionTitleEl && sectionClick?.contains(nextSlot.el)) clickSectionTitleEl.textContent = nextSlot.label;
          if (collectionTitleEl && sectionConcepts?.contains(nextSlot.el)) collectionTitleEl.textContent = nextSlot.label;
        } else {
          activeSoundLabel.textContent = "Select sounds";
        }
      }

      const collectionTitleEl = document.getElementById("collectionTitle");
      if (collectionTitleEl) collectionTitleEl.textContent = getCurrentCollectionName();

      function applyCollectionUI(name) {
        setCollection(name);
        document.body.setAttribute("data-collection", name);
        if (collectionTitleEl) collectionTitleEl.textContent = name;
        document.querySelectorAll("#sectionConcepts .pad[data-collection]").forEach((b) => {
          const isActive = b.getAttribute("data-collection") === name;
          b.setAttribute("aria-pressed", isActive);
          b.classList.toggle("active", isActive);
        });
        if (soundEnabled) playClick();
      }

      document.getElementById("btnBubble")?.addEventListener("click", () => applyCollectionUI("Bubble"));
      document.getElementById("btnGlass")?.addEventListener("click", () => applyCollectionUI("Glass"));
      document.getElementById("btnAgent")?.addEventListener("click", () => applyCollectionUI("Agent"));
      document.getElementById("btnWoods")?.addEventListener("click", () => applyCollectionUI("Woods"));
      applyCollectionUI(getCurrentCollectionName());

      const themeSwitchEl = document.getElementById("themeSwitch");
      function updateThemeSwitchLabel() {
        if (!themeSwitchEl) return;
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        themeSwitchEl.setAttribute("aria-checked", isDark);
        themeSwitchEl.setAttribute("aria-label", isDark ? "Tema oscuro activado" : "Activar tema oscuro");
      }
      if (themeSwitchEl) {
        updateThemeSwitchLabel();
        themeSwitchEl.addEventListener("click", () => {
          const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          updateThemeSwitchLabel();
          if (soundEnabled) playToggle(next === "dark");
        });
      }
      if (soundEnabledEl) soundEnabledEl.addEventListener("change", () => { soundEnabled = soundEnabledEl.checked; });

      const clickPads = [
        ["btnClick", playClick, "Click"],
        ["btnPop", playPop, "Pointing"],
        ["btnTick", playTick, "Tick"],
        ["btnDrop", playDropPressed, "Drop"],
        ["btnSuccess", playSuccess, "Success"],
        ["btnError", playError, "Error"],
        ["btnWarning", playWarning, "Warning"],
        ["btnStartup", playStartup, "Start"],
      ];

      clickPads.forEach(([id, fn, label]) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("click", () => {
          if (soundEnabled) {
            if (appMode === "playground") playPlaygroundForPad(id);
            else fn();
          }
          togglePadSelection(el, () => appMode === "playground" ? playPlaygroundForPad(id) : fn(), label);
        });
      });

      const toggleIconOffPath = "M176,56H80a72,72,0,0,0,0,144h96a72,72,0,0,0,0-144Zm0,128H80A56,56,0,0,1,80,72h96a56,56,0,0,1,0,112ZM80,88a40,40,0,1,0,40,40A40,40,0,0,0,80,88Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,80,152Z";
      const toggleIconOnPath = "M176,56H80a72,72,0,0,0,0,144h96a72,72,0,0,0,0-144Zm0,128H80A56,56,0,0,1,80,72h96a56,56,0,0,1,0,112Zm0-96a40,40,0,1,0,40,40A40,40,0,0,0,176,88Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,176,152Z";
      let toggleState = false;
      const toggleBtn = document.getElementById("btnToggle");
      const toggleLabelEl = document.getElementById("toggleLabel");
      const toggleIconEl = document.getElementById("toggleIcon");
      function updateToggleIcon() {
        if (toggleIconEl) {
          const path = toggleIconEl.querySelector("path");
          if (path) path.setAttribute("d", toggleState ? toggleIconOnPath : toggleIconOffPath);
        }
      }
      if (toggleBtn) {
        if (toggleLabelEl) toggleLabelEl.textContent = "Toggle Off";
        updateToggleIcon();
        toggleBtn.addEventListener("click", () => {
          toggleState = !toggleState;
          toggleBtn.setAttribute("aria-pressed", toggleState);
          if (toggleLabelEl) toggleLabelEl.textContent = toggleState ? "Toggle On" : "Toggle Off";
          updateToggleIcon();
          if (soundEnabled) {
            if (appMode === "playground") {
              playPlaygroundTone({
                type: playgroundWaveform,
                attackSec: playgroundAttackSec,
                decaySec: playgroundDecaySec,
                freq: toggleState ? 400 : 280,
                peak: 0.26,
              });
            } else playToggle(toggleState);
          }
          togglePadSelection(
            toggleBtn,
            async () => {
              if (appMode === "playground") playPlaygroundTone({ type: playgroundWaveform, attackSec: playgroundAttackSec, decaySec: playgroundDecaySec, freq: toggleState ? 400 : 280, peak: 0.26 });
              else await playToggle(toggleState);
            },
            "Toggle"
          );
        });
      }

      const leftConceptPads = [
        ["btnSine", playSine, "Sine"],
        ["btnTriangle", playTriangle, "Triangle"],
        ["btnSquare", playSquare, "Square"],
      ];
      leftConceptPads.forEach(([id, fn, label]) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("click", () => {
          if (soundEnabled) {
            if (appMode === "playground") playPlaygroundTone({ type: playgroundWaveform, attackSec: playgroundAttackSec, decaySec: playgroundDecaySec, freq: id === "btnSine" ? 440 : id === "btnTriangle" ? 550 : 660, peak: 0.22 });
            else fn();
          }
          togglePadSelection(el, () => appMode === "playground" ? playPlaygroundTone({ type: playgroundWaveform, attackSec: playgroundAttackSec, decaySec: playgroundDecaySec, freq: id === "btnSine" ? 440 : id === "btnTriangle" ? 550 : 660, peak: 0.22 }) : fn(), label);
        });
      });

      const btnClick = document.getElementById("btnClick");
      if (btnClick) {
        selectedSlots.push({ el: btnClick, playFn: () => playClick(), label: "Click" });
        refreshSelectionUI();
      }

      const activeSoundCircleEl = document.getElementById("activeSoundCircle");
      if (activeSoundCircleEl) {
        activeSoundCircleEl.setAttribute("role", "button");
        activeSoundCircleEl.setAttribute("aria-label", "Play next sound in cycle");
        activeSoundCircleEl.addEventListener("click", async () => {
          if (!isSoundAllowed() || selectedSlots.length === 0) return;
          const slot = selectedSlots[nextPlayIndex];
          await Promise.resolve(slot.playFn());
          nextPlayIndex = (nextPlayIndex + 1) % selectedSlots.length;
          refreshSelectionUI();
          renderMeta();
        });
      }

      renderMeta();
      window.__ctx = getAudioContext;
    </script>
  </body>
