<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound Lab – SoundDesign</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --panel: #ffffff;
        --text: #1e293b;
        --muted: #64748b;
        --accent: #2563eb;
        --accent-dim: rgba(37, 99, 235, 0.12);
        --border: #e2e8f0;
        --border-inactive: #cbd5e1;
        --gray-a3: rgba(0, 0, 0, 0.04);
        --gray-3: #c2c2c2;
        --black-a1: rgba(0, 0, 0, 0.05);
        --gray-a2: rgba(0, 0, 0, 0.06);
      }
      body[data-collection="Glass"] {
        --accent: color(display-p3 0.553 0.553 0.553);
        --accent-dim: color(display-p3 0.553 0.553 0.553 / 0.12);
      }
      body[data-collection="Agent"] {
        --accent: #c026d3;
        --accent-dim: rgba(192, 38, 211, 0.18);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: color(display-p3 0.975 0.975 0.975);
        color: var(--text);
        padding: 28px;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        display: grid;
        gap: 0;
      }
      header {
        display: grid;
        gap: 4px;
        margin-bottom: 32px;
      }
      h1 {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.087px;
        color: var(--text);
      }
      h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
      }
      header a {
        color: var(--accent);
        text-decoration: none;
        font-size: 14px;
      }
      header a:hover {
        text-decoration: underline;
      }
      .active-sound-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      .sound-lab-card {
        width: 100%;
        min-height: 384px;
        max-height: 512px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 0 0 1px color-mix(in oklab, var(--gray-a3), var(--gray-3) 25%), 0 0 0 0.5px var(--black-a1), 0 1px 1px 0 var(--gray-a2), 0 2px 1px -1px var(--black-a1), 0 1px 3px 0 var(--black-a1);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.25rem;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }
      .active-sound-circle {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
        cursor: pointer;
      }
      body[data-collection="Glass"] .active-sound-circle {
        box-shadow: 0 4px 14px color(display-p3 0.553 0.553 0.553 / 0.25);
      }
      body[data-collection="Agent"] .active-sound-circle {
        box-shadow: 0 4px 14px rgba(192, 38, 211, 0.35);
      }
      .active-sound-circle .icon {
        width: 32px;
        height: 32px;
        color: #fff;
      }
      .active-sound-circle .icon path {
        fill: currentColor;
      }
      .active-sound-circle .label {
        display: none;
      }
      .dot-indicators {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.25rem;
      }
      .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--border-inactive);
        border: none;
        padding: 0;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .dot.active {
        background: var(--accent);
      }
      .pickers-wrapper {
        display: grid;
        grid-template-columns: auto 1px auto;
        gap: 48px;
        align-items: center;
        justify-content: center;
      }
      .pickers-divider {
        background: var(--border);
        width: 1px;
        height: 96px;
        align-self: center;
        margin-block: auto;
      }
      .pad-section {
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      .pad-section-title {
        margin: 0;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 12px;
        font-weight: 600;
        color: color(display-p3 0.512 0.512 0.512);
        text-align: center;
      }
      .pad-grid {
        display: grid;
        grid-template-columns: repeat(3, 32px);
        gap: 0.5rem;
      }
      .pad {
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 8px;
        border: 1px solid color(display-p3 0 0 0 / 0.09);
        background: var(--panel);
        color: color(display-p3 0 0 0 / 0.09);
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: border-color 0.2s, color 0.2s, transform 0.1s;
        font-size: 0;
      }
      .pad:hover {
        color: color(display-p3 0 0 0 / 0.122);
        border-color: color(display-p3 0 0 0 / 0.122);
      }
      .pad:active {
        transform: scale(0.98);
      }
      .pad:disabled {
        cursor: default;
      }
      .pad.active {
        border-width: 2px;
        border-color: var(--accent);
        color: var(--accent);
      }
      .pad .icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .pad:not(.active) .icon {
        color: #666;
      }
      .pad .icon path {
        fill: currentColor;
      }
      .pad span:not(.icon) {
        display: none;
      }
      .controls-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        padding: 0;
      }
      .controls-bar .sound-toggle {
        display: none;
      }
      .pill {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      input[type="range"] {
        width: 100px;
      }
      .footer {
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>

      if (window.location.protocol === "file:") {
        document.body.innerHTML = "<div style=\"font-family:system-ui;max-width:420px;margin:2rem auto;padding:1.5rem;text-align:center;background:#fef3c7;border:1px solid #f59e0b;border-radius:12px;color:#92400e;\"><p style=\"margin:0 0 0.5rem;font-weight:600;\">No funciona con file://</p><p style=\"margin:0;font-size:0.9rem;\">Los módulos ES no se cargan al abrir el HTML directamente. Desde la carpeta del proyecto ejecuta en la terminal:</p><code style=\"display:block;margin:1rem 0;padding:0.75rem;background:#fff;border-radius:8px;font-size:0.85rem;\">python3 -m http.server 5173</code><p style=\"margin:0;font-size:0.9rem;\">Luego abre <strong>http://localhost:5173</strong> en el navegador.</p></div>";
      }
    </script>
    <script type="module">
      import {
        getAudioContext,
        setMasterVolume,
        setCollection,
        getCurrentCollectionName,
        playSine,
        playTriangle,
        playSquare,
        playClick,
        playPop,
        playTick,
        playToggle,
        playDropPressed,
        playSuccess,
        playError,
        playWarning,
        playStartup,
      } from "./audio/sounds.js";

      const soundEnabledEl = document.getElementById("soundEnabled");
      const activeSoundIcon = document.getElementById("activeSoundIcon");
      const activeSoundLabel = document.getElementById("activeSoundLabel");
      const sectionClick = document.getElementById("sectionClick");
      const sectionConcepts = document.getElementById("sectionConcepts");

      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let soundEnabled = true;

      function isSoundAllowed() {
        if (prefersReducedMotion) return false;
        return soundEnabled;
      }

      function renderMeta() {}

      const clickSectionTitleEl = document.getElementById("clickSectionTitle");

      const selectedSlots = [];
      let nextPlayIndex = 0;

      function isPadSelected(padEl) {
        return selectedSlots.some((s) => s.el === padEl);
      }

      function togglePadSelection(padEl, playFn, label) {
        const idx = selectedSlots.findIndex((s) => s.el === padEl);
        if (idx >= 0) {
          selectedSlots.splice(idx, 1);
          if (nextPlayIndex >= selectedSlots.length && selectedSlots.length > 0) nextPlayIndex = Math.max(0, selectedSlots.length - 1);
        } else {
          selectedSlots.push({ el: padEl, playFn, label });
        }
        refreshSelectionUI();
      }

      function refreshSelectionUI() {
        document.querySelectorAll(".pad").forEach((p) => {
          if (sectionConcepts?.contains(p) && p.hasAttribute("data-collection")) {
            p.classList.toggle("active", p.getAttribute("data-collection") === getCurrentCollectionName());
          } else {
            p.classList.toggle("active", isPadSelected(p));
          }
        });
        const dotIndicatorsEl = document.getElementById("dotIndicators");
        if (dotIndicatorsEl) {
          dotIndicatorsEl.innerHTML = "";
          selectedSlots.forEach((slot, i) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "dot" + (i === nextPlayIndex ? " active" : "");
            btn.setAttribute("role", "tab");
            btn.setAttribute("aria-selected", i === nextPlayIndex);
            btn.setAttribute("data-index", String(i));
            btn.setAttribute("title", slot.label);
            btn.addEventListener("click", () => {
              nextPlayIndex = i;
              refreshSelectionUI();
            });
            dotIndicatorsEl.appendChild(btn);
          });
        }
        const nextSlot = selectedSlots[nextPlayIndex];
        if (nextSlot) {
          const icon = nextSlot.el.querySelector(".icon");
          if (icon) {
            activeSoundIcon.innerHTML = icon.innerHTML;
            activeSoundIcon.setAttribute("viewBox", icon.getAttribute("viewBox") || "0 0 24 24");
          }
          activeSoundLabel.textContent = selectedSlots.length > 1 ? `${nextSlot.label} (${nextPlayIndex + 1}/${selectedSlots.length})` : nextSlot.label;
          if (clickSectionTitleEl && sectionClick?.contains(nextSlot.el)) clickSectionTitleEl.textContent = nextSlot.label;
          if (collectionTitleEl && sectionConcepts?.contains(nextSlot.el)) collectionTitleEl.textContent = nextSlot.label;
        } else {
          activeSoundLabel.textContent = "Select sounds";
        }
      }

      const collectionTitleEl = document.getElementById("collectionTitle");
      if (collectionTitleEl) collectionTitleEl.textContent = getCurrentCollectionName();

      function applyCollectionUI(name) {
        setCollection(name);
        document.body.setAttribute("data-collection", name);
        if (collectionTitleEl) collectionTitleEl.textContent = name;
        document.querySelectorAll("#sectionConcepts .pad[data-collection]").forEach((b) => {
          const isActive = b.getAttribute("data-collection") === name;
          b.setAttribute("aria-pressed", isActive);
          b.classList.toggle("active", isActive);
        });
      }

      document.getElementById("btnBubble")?.addEventListener("click", () => applyCollectionUI("Bubble"));
      document.getElementById("btnGlass")?.addEventListener("click", () => applyCollectionUI("Glass"));
      document.getElementById("btnAgent")?.addEventListener("click", () => applyCollectionUI("Agent"));
      applyCollectionUI(getCurrentCollectionName());

      if (soundEnabledEl) soundEnabledEl.addEventListener("change", () => { soundEnabled = soundEnabledEl.checked; });

      const clickPads = [
        ["btnClick", playClick, "Click"],
        ["btnPop", playPop, "Pop"],
        ["btnTick", playTick, "Tick"],
        ["btnDrop", playDropPressed, "Drop"],
        ["btnSuccess", playSuccess, "Success"],
        ["btnError", playError, "Error"],
        ["btnWarning", playWarning, "Warning"],
        ["btnStartup", playStartup, "Startup"],
      ];

      clickPads.forEach(([id, fn, label]) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("click", () => togglePadSelection(el, () => fn(), label));
      });

      let toggleState = false;
      const toggleBtn = document.getElementById("btnToggle");
      const toggleLabelEl = document.getElementById("toggleLabel");
      if (toggleBtn) {
        if (toggleLabelEl) toggleLabelEl.textContent = "Toggle Off";
        toggleBtn.addEventListener("click", () =>
          togglePadSelection(
            toggleBtn,
            async () => {
              toggleState = !toggleState;
              toggleBtn.setAttribute("aria-pressed", toggleState);
              if (toggleLabelEl) toggleLabelEl.textContent = toggleState ? "Toggle On" : "Toggle Off";
              await playToggle(toggleState);
            },
            "Toggle"
          )
        );
      }

      const leftConceptPads = [
        ["btnSine", playSine, "Sine"],
        ["btnTriangle", playTriangle, "Triangle"],
        ["btnSquare", playSquare, "Square"],
      ];
      leftConceptPads.forEach(([id, fn, label]) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("click", () => togglePadSelection(el, () => fn(), label));
      });

      const btnClick = document.getElementById("btnClick");
      if (btnClick) {
        selectedSlots.push({ el: btnClick, playFn: () => playClick(), label: "Click" });
        refreshSelectionUI();
      }

      const activeSoundCircleEl = document.getElementById("activeSoundCircle");
      if (activeSoundCircleEl) {
        activeSoundCircleEl.setAttribute("role", "button");
        activeSoundCircleEl.setAttribute("aria-label", "Play next sound in cycle");
        activeSoundCircleEl.addEventListener("click", async () => {
          if (!isSoundAllowed() || selectedSlots.length === 0) return;
          const slot = selectedSlots[nextPlayIndex];
          await Promise.resolve(slot.playFn());
          nextPlayIndex = (nextPlayIndex + 1) % selectedSlots.length;
          refreshSelectionUI();
          renderMeta();
        });
      }

      setMasterVolume(1);
      renderMeta();
      window.__ctx = getAudioContext;
    </script>
  </body>
</html>
