<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Export Bubble sounds (WAV)</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 360px; margin: 0 auto; }
      h1 { font-size: 1.1rem; margin-bottom: 0.5rem; }
      p { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
      button { display: block; width: 100%; padding: 0.75rem 1rem; margin-bottom: 0.5rem; cursor: pointer; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 0.95rem; }
      button:hover { background: #f5f5f5; }
    </style>
  </head>
  <body>
    <h1>Export Bubble sounds</h1>
    <p>Download Click, Tick, and Startup as WAV to use in Framer or elsewhere.</p>
    <button type="button" id="btnClick">Download bubble-click.wav</button>
    <button type="button" id="btnTick">Download bubble-tick.wav</button>
    <button type="button" id="btnStartup">Download bubble-startup.wav</button>
    <script type="module">
      import { exportBubbleClickWav, exportBubbleTickWav, exportBubbleStartupWav } from "./audio/exportBubbleWav.js";
      document.getElementById("btnClick").addEventListener("click", () => exportBubbleClickWav());
      document.getElementById("btnTick").addEventListener("click", () => exportBubbleTickWav());
      document.getElementById("btnStartup").addEventListener("click", () => exportBubbleStartupWav());
    </script>
  </body>
</html>
